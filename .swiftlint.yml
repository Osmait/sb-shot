included:
  - sb-shot
  - sb-shotTests
  - sb-shotUITests

excluded:
  - sb-shot.xcodeproj

disabled_rules:
  - trailing_whitespace
  - line_length
  - type_body_length
  - file_length
  - function_body_length
  - trailing_comma
  - opening_brace

opt_in_rules:
  - empty_count
  - closure_spacing
  - contains_over_first_not_nil
  - fatal_error_message
  - first_where
  - implicitly_unwrapped_optional
  - overridden_super_call
  - private_outlet
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument

force_cast: warning
force_try: warning

identifier_name:
  min_length:
    warning: 1
  excluded:
    - id
    - x
    - y
    - r
    - s
    - e
    - p1
    - p2

nesting:
  type_level: 2

reporter: xcode
