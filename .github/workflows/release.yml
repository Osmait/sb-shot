# Run by hand from the Actions tab: picks the next version from the latest tag,
# builds a DMG and publishes it as a GitHub release with a new tag. Signing,
# notarization and the Homebrew tap update switch on by themselves once their
# secrets exist; see docs/RELEASING.md. A dry run does everything except
# publishing: the DMG is kept as a downloadable artifact of the run.
name: Release
run-name: Release (${{ inputs.bump }})${{ inputs.dry_run && ' - dry run' || '' }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to increase"
        type: choice
        options: [patch, minor, major]
        default: patch
      dry_run:
        description: "Dry run: build, sign and notarize without publishing"
        type: boolean
        default: false

concurrency: release

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      DRY_RUN: ${{ inputs.dry_run }}
      HAS_CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE != '' }}
      HAS_NOTARY_KEY: ${{ secrets.NOTARY_KEY != '' }}
      HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick the version
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)"
          if [[ -z "$latest" ]]; then
            version="0.1.0"
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            case "$BUMP" in
              major) version="$((major + 1)).0.0" ;;
              minor) version="$major.$((minor + 1)).0" ;;
              *)     version="$major.$minor.$((patch + 1))" ;;
            esac
          fi
          # A draft has no tag yet, so a second run would pick the same version.
          if [[ "$DRY_RUN" != true ]] && gh release view "v$version" > /dev/null 2>&1; then
            echo "::error::A release for v$version already exists (maybe a draft). Publish or delete it first."
            exit 1
          fi
          echo "Releasing $version (previous: ${latest:-none})"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # The project needs Xcode 26 or later (default MainActor isolation, approachable concurrency).
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Import the Developer ID certificate
        if: env.HAS_CERTIFICATE == 'true'
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          echo "SIGN_IDENTITY=Developer ID Application" >> "$GITHUB_ENV"
          echo "TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> "$GITHUB_ENV"

      - name: Prepare the notarization key
        if: env.HAS_CERTIFICATE == 'true' && env.HAS_NOTARY_KEY == 'true'
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
        run: |
          echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
          echo "NOTARY_KEY_ID=${{ secrets.NOTARY_KEY_ID }}" >> "$GITHUB_ENV"
          echo "NOTARY_ISSUER_ID=${{ secrets.NOTARY_ISSUER_ID }}" >> "$GITHUB_ENV"

      - name: Build the DMG
        run: scripts/release.sh "$VERSION"

      - name: Keep the DMG from the dry run
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SbShot-${{ env.VERSION }}
          path: dist/SbShot-${{ env.VERSION }}.dmg
          retention-days: 7

      - name: Publish the release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Notes from CHANGELOG.md when it has a section for this version,
          # followed by the commits since the previous release.
          notes="$(scripts/changelog.sh "$VERSION")"
          # Builds that aren't notarized stay as drafts, so they never reach users by accident.
          draft=()
          if [[ "$HAS_CERTIFICATE" != true || "$HAS_NOTARY_KEY" != true ]]; then
            draft=(--draft)
            notes="$notes"$'\n\n'"> Unsigned build: macOS will block it until it is signed and notarized."
          fi
          gh release create "v$VERSION" "dist/SbShot-$VERSION.dmg" --target "$GITHUB_SHA" \
            --title "sb-shot $VERSION" --notes "$notes" --generate-notes "${draft[@]}"

      - name: Update the Homebrew cask
        if: env.DRY_RUN != 'true' && env.HAS_CERTIFICATE == 'true' && env.HAS_NOTARY_KEY == 'true' && env.HAS_TAP_TOKEN == 'true'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          sha="$(shasum -a 256 "dist/SbShot-$VERSION.dmg" | cut -d ' ' -f 1)"
          git clone "https://x-access-token:$TAP_TOKEN@github.com/${{ github.repository_owner }}/homebrew-tap.git" "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Casks"
          sed -e "s/{{VERSION}}/$VERSION/" -e "s/{{SHA256}}/$sha/" packaging/homebrew/sb-shot.rb \
            > "$RUNNER_TEMP/tap/Casks/sb-shot.rb"
          cd "$RUNNER_TEMP/tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/sb-shot.rb
          git commit -m "sb-shot $VERSION"
          git push

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8"
